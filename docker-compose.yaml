services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bank_batch
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - mysql

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"

  api-cuentas:
    build: ./api-cuentas
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: mysql
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-xyz/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      mysql:
        condition: service_started
      kafka:
        condition: service_started

  notificaciones-service:
    build: ./notificaciones-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB-HOST: mysql
    depends_on:
      - eureka-server
      - kafka

  clientes-service:
    build: ./clientes-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-xyz/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      mysql:
        condition: service_started
  
  pagos-service:
    build: ./pagos-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-xyz/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      mysql:
        condition: service_started
      kafka:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  mysql-data: