spring.application.name=pagos-service
server.port=8083

spring.config.import=configserver:http://${CONFIG_SERVER_HOST:localhost}:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,refresh

resilience4j.circuitbreaker.instances.pagoService.sliding-window-size=5
resilience4j.circuitbreaker.instances.pagoService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pagoService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pagoService.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.pagoService.max-attempts=3
resilience4j.retry.instances.pagoService.wait-duration=2s

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/banco-xyz/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/banco-xyz


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=3000